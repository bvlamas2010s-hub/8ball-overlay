name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: android-apk-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable signing key
        shell: bash
        run: |
          base64 --decode ci/trajectory-debug-keystore.b64 > ci/trajectory-debug.jks
          keytool -list -keystore ci/trajectory-debug.jks -storepass trajectory123 >/dev/null

      - name: Build and lint debug APK
        run: |
          gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare install file
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TrajectoryOverlay-v0.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: TrajectoryOverlay-v0.4-APK
          path: dist/TrajectoryOverlay-v0.4.apk
          if-no-files-found: error
          retention-days: 90

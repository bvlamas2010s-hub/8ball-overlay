name: Build Cleanroom APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "PoolTrajectoryCleanroom/**"
      - ".github/workflows/build-cleanroom-apk.yml"

concurrency:
  group: cleanroom-apk-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: PoolTrajectoryCleanroom

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PoolTrajectoryCleanroom-v0.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PoolTrajectoryCleanroom-v0.5-APK
          path: PoolTrajectoryCleanroom/dist/PoolTrajectoryCleanroom-v0.5.apk
          if-no-files-found: error
          retention-days: 90
